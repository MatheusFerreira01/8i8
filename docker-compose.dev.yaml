services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: 8i8-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - connectai-network

  redis:
    image: redis:7-alpine
    container_name: 8i8-redis-dev
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped
    networks:
      - connectai-network

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: 8i8-evolution-dev
    depends_on:
      - postgres
      - redis
    ports:
      - "${SERVER_PORT}:8080"
    env_file:
      - .env
    environment:
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://${REDIS_HOST}:${REDIS_PORT}"
    volumes:
      - evolution_instances_dev:/evolution/instances
    restart: unless-stopped
    networks:
      - connectai-network

volumes:
  postgres_data_dev:
  evolution_instances_dev:

networks:
  connectai-network:
    driver: bridge
