services:

  8i8.api:
    image: ${DOCKER_REGISTRY-}8i8api
    build:
      context: .
      dockerfile: 8i8.Api/Dockerfile
    env_file:
      - .env
    environment:
      ConnectionStrings__Postgres: "Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "${REDIS_HOST}:${REDIS_PORT}"
      EvolutionApi__BaseUrl: "${EVOLUTION_API_URL}"
      EvolutionApi__ApiKey: "${AUTHENTICATION_API_KEY}"
      Ollama__BaseUrl: "http://${OLLAMA_HOST}:${OLLAMA_PORT}"
      Ollama__ChatModel: "${OLLAMA_MODEL_CHAT}"
      Ollama__EmbedModel: "${OLLAMA_MODEL_EMBED}"
    depends_on:
      - postgres
      - redis
      - evolution-api
      - ollama

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    depends_on:
      - postgres
      - redis
    ports:
      - "${SERVER_PORT}:8080"
    env_file:
      - .env
    environment:
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://${REDIS_HOST}:${REDIS_PORT}"

volumes:
  ollama_data:
