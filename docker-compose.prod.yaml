services:

  nginx:
    image: nginx:alpine
    container_name: 8i8-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: always
    networks:
      - public-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 8i8-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Ollama__BaseUrl: "http://ollama:11434"
      Ollama__ChatModel: "${OLLAMA_MODEL_CHAT}"
      Ollama__EmbedModel: "${OLLAMA_MODEL_EMBED}"
      EvolutionApi__BaseUrl: "http://evolution-api:8080"
      EvolutionApi__ApiKey: "${AUTHENTICATION_API_KEY}"
      EvolutionApi__WebhookUrl: "${API_WEBHOOK_URL}"
    depends_on:
      - postgres
      - evolution-api
    restart: always
    networks:
      - internal-network
      - public-network

  ollama:
    image: ollama/ollama:latest
    container_name: 8i8-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    networks:
      - internal-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: 8i8-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always
    networks:
      - internal-network

  redis:
    image: redis:7-alpine
    container_name: 8i8-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    restart: always
    networks:
      - internal-network

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: 8i8-evolution-prod
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
    volumes:
      - evolution_instances_prod:/evolution/instances
    restart: always
    networks:
      - internal-network

volumes:
  postgres_data_prod:
  redis_data_prod:
  evolution_instances_prod:
  ollama_data:

networks:
  internal-network:
    driver: bridge
    internal: true
  public-network:
    driver: bridge
