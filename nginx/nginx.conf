server {
    listen 80;
    server_name SEU_DOMINIO.COM;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name SEU_DOMINIO.COM;

    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO.COM/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # API principal
    location / {
        proxy_pass         http://8i8-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Rate limit: 30 req/s por IP
        limit_req zone=api burst=50 nodelay;
    }

    # Webhook — limite mais generoso (Evolution API pode ter rajadas)
    location /webhook/ {
        proxy_pass         http://8i8-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        limit_req zone=webhook burst=100 nodelay;
    }
}

limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=60r/s;
